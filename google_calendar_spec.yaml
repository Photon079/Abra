name: google_calendar
version: "1.0.0"
description: "Coral Source Spec for Google Calendar API. Enables querying calendar events as SQL tables."

# Environment variables or user-inputted credentials required to authenticate
inputs:
  google_access_token:
    type: string
    description: "Google OAuth2 Access Token for Calendar API"
    required: true
    secret: true

# Auth configuration
auth:
  type: bearer
  token: "{{ inputs.google_access_token }}"

# Base API url
base_url: "https://www.googleapis.com/calendar/v3"

# Exposed SQL tables
tables:
  events:
    description: "Calendar events from the primary calendar"
    # Maps to endpoint: https://www.googleapis.com/calendar/v3/calendars/primary/events
    path: "/calendars/primary/events"
    method: GET
    
    # Supported URL parameters mapped to SQL filter pushdowns
    params:
      timeMin:
        type: string
        description: "Lower bound (exclusive) for an event's end time to filter by (RFC3339 formatted)"
      timeMax:
        type: string
        description: "Upper bound (inclusive) for an event's start time to filter by (RFC3339 formatted)"
      singleEvents:
        type: boolean
        description: "Whether to expand recurrent events into instances"
        default: true
      orderBy:
        type: string
        description: "The order of the events returned ('startTime' or 'updated')"
        default: "startTime"

    # API pagination rules
    pagination:
      type: cursor
      cursor_param: pageToken
      next_cursor_path: "$.nextPageToken"
      limit_param: maxResults
      default_limit: 100

    # Path to extract items list from response JSON
    root_path: "$.items"

    # Schema mapping from API JSON response to SQL columns
    columns:
      id:
        type: varchar
        description: "Unique identifier of the calendar event"
        json_path: "$.id"
      title:
        type: varchar
        description: "Event summary / title"
        json_path: "$.summary"
      description:
        type: varchar
        description: "Event detailed description"
        json_path: "$.description"
      status:
        type: varchar
        description: "Status of the event (confirmed, tentative, cancelled)"
        json_path: "$.status"
      start_time:
        type: timestamp
        description: "Event start date-time or date"
        json_path: "$.start.dateTime"
      end_time:
        type: timestamp
        description: "Event end date-time or date"
        json_path: "$.end.dateTime"
      location:
        type: varchar
        description: "Geographic location of the event"
        json_path: "$.location"
      html_link:
        type: varchar
        description: "Link to the Google Calendar UI event"
        json_path: "$.htmlLink"

# Test query for linting/verification validation
test_queries:
  - sql: "SELECT id, title, start_time FROM google_calendar.events LIMIT 5"
