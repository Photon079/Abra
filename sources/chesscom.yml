dsl_version: 3
version: "1.0.0"
name: chesscom
description: "Chess.com public API. No authentication required."
backend: "http"
base_url: "https://api.chess.com/pub"

tables:
  - name: stats
    description: "Player rating statistics"
    request:
      path: "/player/anish789098/stats"
      method: GET
    columns:
      - name: chess_blitz__last__rating
        type: Int64
      - name: chess_rapid__last__rating
        type: Int64
      - name: chess_rapid__record__win
        type: Int64
      - name: chess_rapid__record__loss
        type: Int64
      - name: chess_rapid__record__draw
        type: Int64
      - name: chess_blitz__record__win
        type: Int64
      - name: chess_blitz__record__loss
        type: Int64

  - name: games
    description: "Full game history for May 2026 with PGN moves and accuracy"
    request:
      path: "/player/anish789098/games/2026/05"
      method: GET
    response:
      rows_path: ["games"]
    columns:
      - name: url
        type: Utf8
      - name: pgn
        type: Utf8
      - name: time_class
        type: Utf8
      - name: time_control
        type: Utf8
      - name: end_time
        type: Int64
      - name: rated
        type: Boolean
      - name: white__username
        type: Utf8
      - name: white__rating
        type: Int64
      - name: white__result
        type: Utf8
      - name: black__username
        type: Utf8
      - name: black__rating
        type: Int64
      - name: black__result
        type: Utf8
      - name: accuracies__white
        type: Float64
      - name: accuracies__black
        type: Float64

test_queries:
  - "SELECT chess_blitz__last__rating, chess_rapid__last__rating FROM chesscom.stats"
  - "SELECT time_class, white__username, white__result, black__username, black__result FROM chesscom.games LIMIT 3"
