<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abra — Second Brain</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Outfit:wght@400;600;800;900&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050508;
            --surface-color: rgba(10, 10, 18, 0.6);
            --border-color: rgba(102, 252, 241, 0.12);
            --primary-color: #66fcf1;
            --secondary-color: #45f3ff;
            --primary-glow: rgba(102, 252, 241, 0.35);
            --accent-purple: #9b5de5;
            --text-color: #c5c6c7;
            --text-header: #ffffff;
            --danger-color: #ff0055;
            --font-display: 'Space Grotesk', sans-serif;
            --font-sans: 'Outfit', sans-serif;
            --font-mono: 'Fira Code', monospace;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            background-color: var(--bg-color);
            background-image:
                linear-gradient(rgba(18, 18, 30, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(18, 18, 30, 0.3) 1px, transparent 1px);
            background-size: 30px 30px; background-attachment: fixed;
            color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column;
        }
        a { text-decoration: none; }
        ::-webkit-scrollbar { height: 8px; width: 8px; }
        ::-webkit-scrollbar-thumb { background: rgba(102,252,241,0.2); border-radius: 8px; }

        header {
            padding: 16px 40px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color); backdrop-filter: blur(15px);
            background: rgba(5, 5, 8, 0.85); flex-shrink: 0;
        }
        .logo-section { display: flex; align-items: center; gap: 12px; }
        .logo-section h1 { font-family: var(--font-display); font-weight: 900; font-size: 20px; letter-spacing: 2px; color: var(--text-header); text-transform: uppercase; }
        .nav-links { display: flex; gap: 4px; margin-left: 20px; }
        .nav-link { padding: 8px 18px; border-radius: 8px; font-family: var(--font-display); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; }
        .nav-link-active { color: var(--bg-color); background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); box-shadow: 0 0 15px rgba(102, 252, 241, 0.2); }
        .nav-link-inactive { color: rgba(255,255,255,0.5); border: 1px solid transparent; }
        .nav-link-inactive:hover { color: var(--primary-color); border-color: var(--border-color); }
        .header-left { display: flex; align-items: center; }
        .mem-badge { font-family: var(--font-mono); font-size: 11px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.02); display: flex; align-items: center; gap: 8px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger-color); box-shadow: 0 0 8px var(--danger-color); }
        .dot.on { background: var(--primary-color); box-shadow: 0 0 8px var(--primary-color); }

        /* ── date rail ── */
        .rail-wrap { padding: 20px 40px 4px; display: flex; align-items: center; gap: 16px; }
        .rail-title { font-family: var(--font-display); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: var(--text-header); white-space: nowrap; }
        .rail-title span { color: var(--primary-color); }
        .jump { background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 7px 10px; color: var(--text-color); font-family: var(--font-mono); font-size: 12px; color-scheme: dark; outline: none; }
        .rail { display: flex; gap: 8px; overflow-x: auto; padding: 14px 40px 18px; }
        .daychip {
            flex: 0 0 auto; min-width: 60px; padding: 10px 6px; border-radius: 14px; cursor: pointer;
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
            display: flex; flex-direction: column; align-items: center; gap: 3px; transition: all 0.15s; position: relative;
        }
        .daychip:hover { border-color: rgba(102,252,241,0.35); transform: translateY(-2px); }
        .daychip .wd { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.45); }
        .daychip .dn { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--text-header); line-height: 1; }
        .daychip .mo { font-family: var(--font-mono); font-size: 9px; color: rgba(255,255,255,0.35); }
        .daychip .hasdot { width: 5px; height: 5px; border-radius: 50%; background: var(--secondary-color); position: absolute; bottom: 6px; }
        .daychip.today { border-color: rgba(102,252,241,0.5); }
        .daychip.active { background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); border-color: transparent; box-shadow: 0 6px 18px rgba(102,252,241,0.25); }
        .daychip.active .wd, .daychip.active .dn, .daychip.active .mo { color: #050508; }
        .daychip.active .hasdot { background: #050508; }

        .hud-container { flex: 1; max-width: 1700px; width: 100%; margin: 0 auto; padding: 6px 30px 30px; display: grid; grid-template-columns: 1.05fr 1.05fr 0.9fr; gap: 26px; }
        @media (max-width: 1100px) { .hud-container { grid-template-columns: 1fr; } }

        .hud-panel { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 20px; backdrop-filter: blur(20px); box-shadow: inset 0 0 20px rgba(102, 252, 241, 0.03), 0 10px 40px rgba(0, 0, 0, 0.6); padding: 24px; display: flex; flex-direction: column; position: relative; overflow: hidden; }
        .hud-panel::before { content: ''; position: absolute; top: 0; left: 0; width: 12px; height: 12px; border-top: 2px solid var(--primary-color); border-left: 2px solid var(--primary-color); }
        .hud-panel::after { content: ''; position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; border-bottom: 2px solid var(--primary-color); border-right: 2px solid var(--primary-color); }
        .panel-header { margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 12px; }
        .panel-title { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--text-header); text-transform: uppercase; letter-spacing: 1.5px; display: flex; align-items: center; gap: 10px; }
        .panel-sub { font-family: var(--font-mono); font-size: 11px; color: var(--primary-color); }

        input, textarea, select { width: 100%; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 11px 13px; color: var(--text-header); font-family: var(--font-sans); font-size: 14px; outline: none; transition: border-color 0.2s; color-scheme: dark; }
        input:focus, textarea:focus, select:focus { border-color: var(--primary-color); }
        textarea { resize: vertical; min-height: 66px; }
        .row { display: flex; gap: 10px; }
        .field-label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255,255,255,0.4); margin: 12px 0 6px; display: block; }
        .btn { padding: 11px 18px; border-radius: 10px; border: none; font-family: var(--font-display); font-weight: 700; font-size: 12px; cursor: pointer; transition: all 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        .btn-primary { background: linear-gradient(135deg, var(--primary-color), var(--secondary-color)); color: #050508; box-shadow: 0 4px 15px rgba(102, 252, 241, 0.25); }
        .btn-primary:hover:not(:disabled) { box-shadow: 0 0 20px var(--primary-color); transform: translateY(-2px); }
        .btn-secondary { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: var(--text-color); }
        .btn-secondary:hover { background: rgba(255,255,255,0.08); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .list { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: 58vh; }
        .empty { color: rgba(255,255,255,0.3); font-size: 13px; font-style: italic; text-align: center; padding: 26px 10px; border: 1px dashed rgba(255,255,255,0.08); border-radius: 12px; }

        .seg { display: inline-flex; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); border-radius: 9px; padding: 3px; gap: 3px; }
        .seg button { border: none; background: none; color: rgba(255,255,255,0.5); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; padding: 5px 12px; border-radius: 6px; cursor: pointer; }
        .seg button.on { background: rgba(102,252,241,0.15); color: var(--primary-color); }

        .task { display: flex; align-items: center; gap: 12px; padding: 11px 13px; border-radius: 11px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); }
        .task .check { width: 20px; height: 20px; flex-shrink: 0; border-radius: 6px; border: 2px solid var(--primary-color); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--bg-color); }
        .task.done .check { background: var(--primary-color); }
        .task .title { flex: 1; font-size: 14px; color: var(--text-header); }
        .task.done .title { text-decoration: line-through; color: rgba(255,255,255,0.35); }
        .badge { font-family: var(--font-mono); font-size: 9px; padding: 3px 7px; border-radius: 6px; text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
        .badge.cat { color: var(--accent-purple); background: rgba(155,93,229,0.1); }
        .badge.due { color: var(--secondary-color); background: rgba(69,243,255,0.08); }
        .task .del { color: rgba(255,255,255,0.25); cursor: pointer; font-size: 16px; background: none; border: none; }
        .task .del:hover { color: var(--danger-color); }

        .entry { padding: 15px; border-radius: 12px; background: rgba(102,252,241,0.03); border: 1px solid rgba(102,252,241,0.12); }
        .entry .meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .entry .mood { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--secondary-color); border: 1px solid rgba(69,243,255,0.2); padding: 3px 9px; border-radius: 20px; }
        .entry .when { font-family: var(--font-mono); font-size: 11px; color: rgba(255,255,255,0.4); }
        .entry .summary { font-size: 14px; color: var(--text-color); line-height: 1.55; }
        .entry .acts { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { font-family: var(--font-mono); font-size: 10px; padding: 3px 9px; border-radius: 6px; background: rgba(102,252,241,0.08); color: var(--primary-color); }

        .mem-answer { margin-top: 14px; padding: 14px; border-radius: 10px; background: rgba(155,93,229,0.06); border: 1px solid rgba(155,93,229,0.2); font-size: 14px; line-height: 1.55; color: var(--text-header); white-space: pre-wrap; min-height: 40px; }
        .hint { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 8px; }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div class="logo-section">
                <img src="/favicon.ico" alt="Abra" style="width:30px;height:30px;border-radius:50%;box-shadow:0 0 20px var(--primary-glow);">
                <h1>Abra</h1>
            </div>
            <nav class="nav-links">
                <a href="/" class="nav-link nav-link-inactive">Dashboard</a>
                <a href="/chat.html" class="nav-link nav-link-inactive">Chat Terminal</a>
                <a href="/brain.html" class="nav-link nav-link-active">Second Brain</a>
            </nav>
        </div>
        <div class="mem-badge" id="mem-badge"><span class="dot" id="mem-dot"></span><span id="mem-text">Graph: checking…</span></div>
    </header>

    <div class="rail-wrap">
        <div class="rail-title">Journal · <span id="rail-selected">—</span></div>
        <input type="date" class="jump" id="jump" onchange="selectDate(this.value)">
    </div>
    <div class="rail" id="rail"></div>

    <main class="hud-container">
        <!-- DIARY -->
        <section class="hud-panel">
            <div class="panel-header">
                <div class="panel-title">📓 Diary</div>
                <div class="panel-sub" id="diary-day">—</div>
            </div>
            <textarea id="diary-summary" placeholder="What happened on this day? Syncs to your Notion diary + feeds Abra's memory."></textarea>
            <div class="row" style="margin-top:10px;">
                <select id="diary-mood" style="flex:1;">
                    <option>Stable</option><option>Focused</option><option>Scattered</option>
                    <option>Stressed</option><option>Low Energy</option>
                </select>
                <button class="btn btn-primary" style="flex:0 0 auto;" onclick="addDiary()">Save</button>
            </div>
            <input id="diary-acts" placeholder="Activities: Coding, Running, Chess…" style="margin-top:10px;">
            <div class="list" id="diary-list"><div class="empty">Loading…</div></div>
        </section>

        <!-- TASKS -->
        <section class="hud-panel">
            <div class="panel-header">
                <div class="panel-title">✅ To-Do</div>
                <div class="seg" id="task-seg">
                    <button data-mode="day" onclick="setTaskMode('day')">This day</button>
                    <button data-mode="all" class="on" onclick="setTaskMode('all')">All</button>
                </div>
            </div>
            <div class="row">
                <input id="task-title" placeholder="Add a task…" onkeydown="if(event.key==='Enter')addTask()" style="flex:1;">
                <button class="btn btn-primary" style="flex:0 0 auto;" onclick="addTask()">Add</button>
            </div>
            <input id="task-cat" placeholder="Category (optional)" style="margin-top:10px;">
            <div class="list" id="task-list"><div class="empty">Loading…</div></div>
        </section>

        <!-- MEMORY -->
        <section class="hud-panel">
            <div class="panel-header"><div class="panel-title">🧠 Graph Memory</div></div>
            <textarea id="mem-q" placeholder="Ask your memory… e.g. how has my mood changed since exam season?"></textarea>
            <div class="row" style="margin-top:12px;">
                <button class="btn btn-primary" style="flex:2;" id="ask-btn" onclick="askMemory()">Ask</button>
                <button class="btn btn-secondary" style="flex:1;" id="backfill-btn" onclick="runBackfill()">Backfill</button>
            </div>
            <div class="mem-answer" id="mem-answer">Answers come from Abra's Cognee knowledge graph — relationships and history, not raw dumps.</div>
            <div class="hint" id="mem-hint"></div>
        </section>
    </main>

    <script>
        const H = { 'Content-Type': 'application/json' };
        const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        let allDiary = [], allTasks = [], taskMode = 'all';
        const pad = n => String(n).padStart(2,'0');
        const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
        const parseISO = s => new Date(s+'T00:00:00');
        const todayISO = ymd(new Date());
        let selectedDate = todayISO;
        const fmtLong = iso => { const d=parseISO(iso); return WD[d.getDay()]+', '+MO[d.getMonth()]+' '+d.getDate(); };
        const esc = s => (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

        async function loadMemStatus() {
            try { const d = await (await fetch('/api/memory')).json();
                const on = d.enabled && d.connected;
                document.getElementById('mem-dot').className = 'dot' + (on ? ' on' : '');
                document.getElementById('mem-text').textContent = 'Graph: ' + (d.enabled ? (d.connected ? 'connected' : 'enabled') : 'off');
            } catch { document.getElementById('mem-text').textContent = 'Graph: unreachable'; }
        }

        async function refresh() {
            const [dRes, tRes] = await Promise.all([fetch('/api/notion/diary'), fetch('/api/notion/tasks')]);
            allDiary = (await dRes.json()).entries || [];
            allTasks = (await tRes.json()).tasks || [];
            renderRail(); renderDiary(); renderTasks();
        }

        function railDates() {
            const set = new Set();
            const t = new Date(); t.setHours(0,0,0,0);
            for (let i=0;i<21;i++){ const d=new Date(t); d.setDate(t.getDate()-i); set.add(ymd(d)); }
            allDiary.forEach(e=>e.date && set.add(e.date));
            allTasks.forEach(t=>t.deadline && set.add(t.deadline));
            if (selectedDate) set.add(selectedDate);
            return [...set].sort().reverse();
        }

        function renderRail() {
            const diaryDays = new Set(allDiary.map(e=>e.date));
            const taskDays = new Set(allTasks.filter(t=>t.deadline).map(t=>t.deadline));
            document.getElementById('rail-selected').textContent = fmtLong(selectedDate);
            document.getElementById('jump').value = selectedDate;
            document.getElementById('rail').innerHTML = railDates().map(iso => {
                const d = parseISO(iso);
                const cls = ['daychip'];
                if (iso === selectedDate) cls.push('active');
                if (iso === todayISO) cls.push('today');
                const has = diaryDays.has(iso) || taskDays.has(iso);
                return `<div class="${cls.join(' ')}" onclick="selectDate('${iso}')">
                    <span class="wd">${WD[d.getDay()]}</span>
                    <span class="dn">${d.getDate()}</span>
                    <span class="mo">${MO[d.getMonth()]}</span>
                    ${has ? '<span class="hasdot"></span>' : ''}
                </div>`;
            }).join('');
        }

        function selectDate(iso) {
            if (!iso) return;
            selectedDate = iso;
            renderRail(); renderDiary(); renderTasks();
        }

        function renderDiary() {
            document.getElementById('diary-day').textContent = (selectedDate===todayISO?'Today · ':'') + fmtLong(selectedDate);
            const entries = allDiary.filter(e => e.date === selectedDate);
            const list = document.getElementById('diary-list');
            list.innerHTML = entries.length ? entries.map(e => `
                <div class="entry">
                    <div class="meta"><span class="when">${e.date}</span>${e.mood?`<span class="mood">${esc(e.mood)}</span>`:''}</div>
                    <div class="summary">${esc(e.summary) || '<i style="opacity:.4">No summary</i>'}</div>
                    ${e.activities&&e.activities.length?`<div class="acts">${e.activities.map(a=>`<span class="chip">${esc(a)}</span>`).join('')}</div>`:''}
                </div>`).join('') : `<div class="empty">No diary entry for ${fmtLong(selectedDate)}. Write one above — it saves to this date.</div>`;
        }

        async function addDiary() {
            const summary = document.getElementById('diary-summary').value.trim();
            if (!summary) return;
            const activities = document.getElementById('diary-acts').value.split(',').map(s=>s.trim()).filter(Boolean);
            await fetch('/api/notion/diary', { method:'POST', headers:H, body: JSON.stringify({
                summary, mood: document.getElementById('diary-mood').value, activities, date: selectedDate }) });
            document.getElementById('diary-summary').value=''; document.getElementById('diary-acts').value='';
            refresh();
        }

        function setTaskMode(m) {
            taskMode = m;
            document.querySelectorAll('#task-seg button').forEach(b=>b.classList.toggle('on', b.dataset.mode===m));
            document.getElementById('task-title').placeholder = m==='day' ? `Add a task for ${fmtLong(selectedDate)}…` : 'Add a task…';
            renderTasks();
        }

        function renderTasks() {
            let tasks = allTasks;
            if (taskMode === 'day') tasks = allTasks.filter(t => t.deadline === selectedDate);
            const open = tasks.filter(t=>!t.done).length;
            const list = document.getElementById('task-list');
            if (taskMode==='day') document.getElementById('task-title').placeholder = `Add a task for ${fmtLong(selectedDate)}…`;
            list.innerHTML = tasks.length ? tasks.map(t => `
                <div class="task ${t.done?'done':''}">
                    <div class="check" onclick="toggleTask('${t.id}', ${t.done})">${t.done?'✓':''}</div>
                    <span class="title">${esc(t.title)}</span>
                    ${t.deadline?`<span class="badge due">📅 ${MO[parseISO(t.deadline).getMonth()]} ${parseISO(t.deadline).getDate()}</span>`:''}
                    ${t.category?`<span class="badge cat">${esc(t.category)}</span>`:''}
                    <button class="del" onclick="deleteTask('${t.id}')">✕</button>
                </div>`).join('') : `<div class="empty">${taskMode==='day' ? `No tasks due on ${fmtLong(selectedDate)}.` : 'No tasks yet.'}</div>`;
        }

        async function addTask() {
            const title = document.getElementById('task-title').value.trim();
            if (!title) return;
            const body = { title, category: document.getElementById('task-cat').value.trim() || null };
            if (taskMode === 'day') body.due_date = selectedDate;
            await fetch('/api/notion/tasks', { method:'POST', headers:H, body: JSON.stringify(body) });
            document.getElementById('task-title').value=''; document.getElementById('task-cat').value='';
            refresh();
        }
        async function toggleTask(id, done) {
            await fetch('/api/notion/tasks/'+id, { method:'PATCH', headers:H, body: JSON.stringify({ done: !done }) });
            refresh();
        }
        async function deleteTask(id) {
            await fetch('/api/notion/tasks/'+id, { method:'DELETE' });
            refresh();
        }

        async function askMemory() {
            const q = document.getElementById('mem-q').value.trim(); if (!q) return;
            const btn = document.getElementById('ask-btn'), ans = document.getElementById('mem-answer');
            btn.disabled = true; ans.textContent = 'Querying the graph…';
            try {
                const d = await (await fetch('/api/memory/ask', { method:'POST', headers:H, body: JSON.stringify({ query: q }) })).json();
                ans.textContent = !d.enabled ? 'Graph memory is off. Set USE_GRAPH_MEMORY=true and a Cognee key.'
                    : (d.answer || 'Nothing linked in the graph yet — log a few diary entries, then Backfill.');
            } catch { ans.textContent = 'Request failed.'; }
            btn.disabled = false;
        }
        async function runBackfill() {
            const btn = document.getElementById('backfill-btn'), hint = document.getElementById('mem-hint');
            btn.disabled = true; hint.textContent = 'Backfilling graph from history…';
            try {
                const r = await fetch('/memory/backfill', { method:'POST' }); const d = await r.json();
                hint.textContent = r.ok ? `Ingested ${d.items_ingested} items (${d.diary_entries_found} diary entries).` : (d.detail || 'Backfill failed.');
            } catch { hint.textContent = 'Backfill request failed.'; }
            btn.disabled = false;
        }

        loadMemStatus(); refresh();
    </script>
</body>
</html>
